AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template with hardened S3 buckets and least-privilege IAM configurations

Resources:
  SampleDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::AccountId}-secure-data-bucket"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SampleDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SampleDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLSRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${SampleDataBucket}"
              - !Sub "arn:aws:s3:::${SampleDataBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  SampleGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub "${AWS::AccountId}-least-privilege-group"

  SampleUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${AWS::AccountId}-least-privilege-user"
      Groups:
        - !Ref SampleGroup # Assign the user to the group

  SampleUserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: least_privilege_policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sample-app:*"
      Groups:
        - !Ref SampleGroup